kind = "mobile"
previewPath = "/trails-mobile/"
title = "Trails Mobile — Dive Deep"
version = "1.0.0"
id = "artifacts/trails-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/trails-mobile/" ]
localPort = 18714

[services.development]
run = "pnpm --filter @workspace/trails-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trails-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/trails-mobile", "run", "serve" ]

[services.env]
PORT = "18714"
BASE_PATH = "/trails-mobile/"
